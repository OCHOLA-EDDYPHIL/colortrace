[project]
name = "colortrace-workspace"
version = "0.0.0"
description = "ColorTrace repository policy and pre-implementation workspace"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# Product runtime dependencies are intentionally absent until Gate G0.
