[project]
name = "colortrace-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/fixture-generator",
    "packages/grafana-mcp",
    "packages/repo-tools",
    "packages/telemetry",
    "packages/validators",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/api-client/src/generated"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/fixture-generator/src",
    "packages/grafana-mcp/src",
    "packages/repo-tools/src",
    "packages/telemetry/src",
    "packages/validators/src",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = [
    "packages/fixture-generator/tests",
    "packages/grafana-mcp/tests",
    "packages/repo-tools/tests",
    "packages/telemetry/tests",
    "packages/validators/tests",
]
