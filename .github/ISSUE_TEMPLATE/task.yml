name: Delivery task
description: Implement a scoped, testable roadmap item
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        Use an imperative, sentence-case title that describes the outcome. Do not begin until
        dependencies and the current release gate permit this work; labels describe the work type.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this required and which locked contract does it support?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Exact work included.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Work explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use objective checkboxes, including failure behavior.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue links and gate prerequisites; use None only when true.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and artifacts
      description: Documents, schemas, screenshots, reports, traces, or fixture outputs required.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test expectations
      description: Happy path, failure path, replay, authorization, and compatibility tests as applicable.
    validations:
      required: true
  - type: dropdown
    id: gate
    attributes:
      label: Gate impact
      options:
        - G0 feasibility and scope lock
        - G1 vertical slice
        - G2 alpha product loop
        - G3 beta and feature freeze
        - G4 hosted release candidate
        - G5 submission candidate
        - M6 final submission
        - Post-hackathon only
        - No direct gate impact
    validations:
      required: true
