name: Research or spike
description: Time-box an uncertain decision with falsification criteria
labels:
  - type:spike
body:
  - type: markdown
    attributes:
      value: >-
        Use an imperative, sentence-case title that states the evidence outcome. Labels describe
        the work type; do not add a generic category prefix.
  - type:textarea
    id: question
    attributes:
      label: Decision question
      description: State the decision this evidence will change.
    validations:
      required: true
  - type:textarea
    id: current
    attributes:
      label: Current hypothesis and assumptions
      description: Separate verified facts, inference, and unknowns.
    validations:
      required: true
  - type:textarea
    id: falsification
    attributes:
      label: Falsification and stop criteria
      description: What result rejects the hypothesis, forces a pivot, or ends the spike?
    validations:
      required: true
  - type:input
    id: timebox
    attributes:
      label: Timebox
      placeholder: e.g. 6 hours, ending 2026-08-14 18:00 UTC
    validations:
      required: true
  - type:textarea
    id: method
    attributes:
      label: Method and evidence required
      description: Reproducible procedure, sources, artifacts, runs, and negative controls.
    validations:
      required: true
  - type:textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue links and access required.
    validations:
      required: true
  - type:textarea
    id: outcome
    attributes:
      label: Decision outcome
      description: Complete at close with result, limitations, artifacts, and approved decision.
      value: "Pending."
    validations:
      required: true
