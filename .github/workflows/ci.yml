name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      final_image_evidence:
        description: Build and seal exact final-image evidence
        required: true
        type: boolean
        default: false
      image_runner:
        description: Isolated runner lane for final-image evidence
        required: true
        type: choice
        default: colortrace-secret
        options:
          - colortrace-secret
          - colortrace-docker

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.final_image_evidence && format('Final image evidence - {0}', inputs.image_runner) || 'Manual secret scan') || 'Secret scan' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ${{ github.event_name == 'workflow_dispatch' && inputs.final_image_evidence && inputs.image_runner || 'colortrace-secret' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.final_image_evidence && 120 || 20 }}
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CACHE_ROOT: ${{ github.workspace }}/../../_colortrace-cache
      EVIDENCE_ARTIFACT_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.final_image_evidence && format('final-image-evidence-{0}', inputs.image_runner) || 'security-evidence' }}
      SECURITY_REQUIRE_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.final_image_evidence && 'true' || 'false' }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bootstrap security tools
        run: make bootstrap-security
      - name: Produce exact-candidate security evidence
        timeout-minutes: ${{ env.SECURITY_REQUIRE_IMAGES == 'true' && 105 || 8 }}
        run: >-
          make security-evidence
          SECURITY_CANDIDATE_SHA="$CANDIDATE_SHA"
          SECURITY_REQUIRE_IMAGES="$SECURITY_REQUIRE_IMAGES"
      - name: Verify exact-candidate image cleanup
        if: ${{ always() && env.SECURITY_REQUIRE_IMAGES == 'true' }}
        run: make final-image-cleanup SECURITY_CANDIDATE_SHA="$CANDIDATE_SHA"
      - name: Retain private security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.EVIDENCE_ARTIFACT_PREFIX }}-${{ env.CANDIDATE_SHA }}
          path: .cache/security-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  quality:
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.final_image_evidence && 'Final image dispatch - quality not applicable' || 'Manual quality') || 'Quality' }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.final_image_evidence) }}
    runs-on: [self-hosted, Linux, X64, colortrace-docker]
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CACHE_ROOT: ${{ github.workspace }}/../../_colortrace-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bootstrap quality tools
        run: make bootstrap-quality
      - name: Run independent quality shards
        run: make --jobs=2 check-fast check-telemetry
