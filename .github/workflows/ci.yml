name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, colortrace-secret]
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bootstrap pinned tools
        run: make bootstrap
      - name: Produce exact-candidate security evidence
        run: make security-evidence SECURITY_CANDIDATE_SHA="$CANDIDATE_SHA"
      - name: Retain private security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ env.CANDIDATE_SHA }}
          path: .cache/security-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  quality:
    name: Quality
    runs-on: [self-hosted, Linux, X64, colortrace-docker]
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bootstrap pinned tools
        run: make bootstrap
      - name: Run local quality gate
        run: make check
