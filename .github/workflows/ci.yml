name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, colortrace-secret]
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap pinned tools
        run: make bootstrap
      - name: Scan for secrets
        run: make check-secret

  quality:
    name: Quality
    runs-on: [self-hosted, Linux, X64, colortrace-docker]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bootstrap pinned tools
        run: make bootstrap
      - name: Run local quality gate
        run: make check
