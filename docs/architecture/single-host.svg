<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title description">
  <title id="title">ColorTrace gated single-host architecture</title>
  <desc id="description">A browser user reaches Caddy through the TCP 443 firewall and shared access gate. The owner/deployer applies, stops, and verifies through the control plane plus exact-VM IAP and OS Login access on port 22. The owner has Token Creator only on a dedicated resume service account and impersonates it for exact-VM get and start. Fail-closed startup retrieves a pinned bcrypt verifier from Secret Manager, pulls six admitted images from Artifact Registry and one pinned Prometheus image from Docker Hub, verifies lifecycle state, and writes the Caddy verifier. Caddy bridges separate edge and internal Docker networks. The runtime alone reaches metadata and invokes Vertex AI with a custom prediction permission. Application, telemetry, Caddy, and lifecycle state share one persistent boot disk. ACME, Google identity and APIs, JWKS, and Debian mirrors are explicit outbound dependencies without a general egress allowlist.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44546a"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #182235; }
      .group { fill: #f5f7fb; stroke: #44546a; stroke-width: 2; }
      .boundary { fill: none; stroke-width: 2; stroke-dasharray: 7 5; }
      .edge-boundary { stroke: #6c8ebf; }
      .internal-boundary { stroke: #4f7f44; }
      .role { fill: #eaf2ff; stroke: #3a67a8; }
      .control { fill: #fff2cc; stroke: #b38f00; }
      .managed { fill: #fce8e6; stroke: #b85450; }
      .service { fill: #d9ead3; stroke: #4f7f44; }
      .process { fill: #dae8fc; stroke: #3a67a8; }
      .observe { fill: #ffe6cc; stroke: #c27832; }
      .state { fill: #f8cecc; stroke: #b85450; }
      .box { stroke-width: 2; rx: 10; }
      .label { font: 600 15px system-ui, sans-serif; fill: #182235; text-anchor: middle; }
      .small { font: 13px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #44546a; stroke-width: 2; marker-end: url(#arrow); }
      .state-edge { fill: none; stroke: #8b5b5b; stroke-width: 2; stroke-dasharray: 7 5; }
      .edge-label { font: 12px system-ui, sans-serif; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
    </style>
  </defs>

