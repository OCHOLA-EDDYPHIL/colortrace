  <text x="875" y="82" class="title" text-anchor="middle">Single Compute Engine VM</text>

  <rect x="20" y="90" width="165" height="60" class="box role"/>
  <text x="102" y="116" class="label">Owner / deployer</text>
  <text x="102" y="138" class="small">operator_member</text>
  <rect x="20" y="235" width="175" height="70" class="box role"/>
  <text x="107" y="264" class="small" style="font-weight: 600">Resume service account</text>
  <text x="107" y="287" class="small">resume_member</text>
  <rect x="20" y="390" width="165" height="60" class="box role"/>
  <text x="102" y="426" class="label">Browser user</text>

  <rect x="215" y="130" width="155" height="80" class="box control"/>
  <text x="292" y="163" class="label">Google Cloud</text>
  <text x="292" y="185" class="small">control plane</text>
  <rect x="215" y="405" width="155" height="70" class="box control"/>
  <text x="292" y="446" class="label">VPC firewall + IAP</text>

  <rect x="1390" y="80" width="265" height="60" class="box managed"/>
  <text x="1522" y="116" class="label">Secret Manager</text>
  <rect x="1390" y="180" width="265" height="70" class="box managed"/>
  <text x="1522" y="209" class="label">Artifact Registry</text>
  <text x="1522" y="231" class="small">6 private image digests</text>
  <rect x="1390" y="290" width="265" height="70" class="box managed"/>
  <text x="1522" y="319" class="label">Docker Hub</text>
  <text x="1522" y="341" class="small">pinned Prometheus digest</text>
  <rect x="1390" y="485" width="265" height="60" class="box managed"/>
  <text x="1522" y="521" class="label">Metadata server</text>
  <rect x="1390" y="600" width="265" height="60" class="box managed"/>
  <text x="1522" y="636" class="label">Vertex AI</text>
  <rect x="1390" y="785" width="265" height="100" class="box managed"/>
  <text x="1522" y="813" class="label">Other outbound dependencies</text>
  <text x="1522" y="835" class="small">ACME + Google APIs/identity/JWKS</text>
  <text x="1522" y="856" class="small">+ Debian mirrors</text>
  <text x="1522" y="877" class="small">no general egress allowlist</text>

  <rect x="900" y="105" width="300" height="100" class="box control"/>
  <text x="1050" y="137" class="label">Fail-closed startup</text>
  <text x="1050" y="160" class="small">admission + lifecycle</text>
  <text x="1050" y="181" class="small">+ package inventory</text>

