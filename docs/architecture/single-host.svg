  <text x="577" y="357" class="label">Caddy</text>
  <text x="577" y="380" class="small">TLS 443 + Basic auth</text>
  <text x="577" y="402" class="small">edge ↔ internal bridge</text>

  <rect x="450" y="500" width="820" height="250" rx="12" class="boundary internal-boundary"/>
  <text x="860" y="530" class="label">internal Docker network</text>
  <rect x="1020" y="555" width="210" height="90" class="box service"/>
  <text x="1125" y="585" class="label">Runtime</text>
  <text x="1125" y="607" class="small">facade + validators</text>
  <text x="1125" y="628" class="small">+ simulator</text>
  <rect x="790" y="555" width="190" height="90" class="box process"/>
  <text x="885" y="585" class="label">Pinned Grafana MCP</text>
  <text x="885" y="608" class="small">stdio + read-only catalog</text>
  <rect x="560" y="555" width="180" height="70" class="box observe"/>
  <text x="650" y="596" class="label">Grafana</text>
  <rect x="560" y="660" width="270" height="70" class="box observe"/>
  <text x="695" y="689" class="label">Prometheus + Loki</text>
  <text x="695" y="712" class="small">+ Tempo</text>

  <path d="M 475 805 L 1240 805" class="state-edge"/>
  <path d="M 1200 180 L 1240 180 L 1240 805" class="state-edge"/>
  <path d="M 455 400 L 475 400 L 475 805" class="state-edge"/>
  <path d="M 1125 645 L 1125 805" class="state-edge"/>
  <path d="M 560 590 L 540 590 L 540 805" class="state-edge"/>
  <path d="M 695 730 L 695 805" class="state-edge"/>
  <path d="M 850 805 L 850 835" class="state-edge"/>
  <text x="850" y="790" class="edge-label">durable state</text>
  <path d="M 625 850 C 625 832 1075 832 1075 850 L 1075 905 C 1075 923 625 923 625 905 Z" class="state" stroke-width="2"/>
  <ellipse cx="850" cy="850" rx="225" ry="18" class="state" stroke-width="2"/>
  <text x="850" y="884" class="label">Persistent boot disk</text>
  <text x="850" y="906" class="small">app + telemetry + Caddy + lifecycle state</text>

  <path d="M 185 420 L 215 430" class="edge"/>
  <text x="214" y="400" class="edge-label">TLS 443 + shared access code</text>
  <path d="M 370 440 L 455 378" class="edge"/>
  <path d="M 185 120 L 205 120 L 205 440 L 215 440" class="edge"/>
  <text x="186" y="350" class="edge-label">exact-VM IAP + OS Login; port 22</text>
  <path d="M 185 120 L 215 155" class="edge"/>
  <text x="240" y="100" class="edge-label">Terraform + manual stop</text>
  <path d="M 102 150 L 102 235" class="edge"/>
  <text x="102" y="176" class="edge-label">Token Creator on this SA only</text>
  <text x="102" y="194" class="edge-label">impersonates</text>
  <path d="M 195 270 L 215 190" class="edge"/>
  <text x="275" y="286" class="edge-label">exact VM get + start only</text>
  <path d="M 370 170 L 400 170" class="edge"/>
  <text x="385" y="154" class="edge-label">provision / start / stop</text>

  <path d="M 1390 110 L 1200 130" class="edge"/>
  <text x="1295" y="102" class="edge-label">pinned bcrypt version via VM identity</text>
  <path d="M 1390 215 L 1200 155" class="edge"/>
  <text x="1300" y="195" class="edge-label">six admitted digests</text>
  <path d="M 1390 325 L 1200 180" class="edge"/>
  <text x="1308" y="280" class="edge-label">one admitted digest</text>
  <path d="M 900 175 L 880 175 L 880 300 L 700 345" class="edge"/>
  <text x="790" y="318" class="edge-label">restricted verifier file</text>

  <path d="M 650 325 L 720 235" class="edge"/>
  <text x="660" y="274" class="edge-label">HTTP on edge</text>
  <path d="M 700 350 L 930 350 L 930 575 L 1020 575" class="edge"/>
  <text x="835" y="334" class="edge-label">/v1/demo/* over internal HTTP</text>
  <path d="M 1020 600 L 980 600" class="edge"/>
  <text x="1000" y="586" class="edge-label">stdio</text>
  <path d="M 820 555 L 700 405" class="edge"/>
  <text x="762" y="472" class="edge-label">HTTPS + viewer token</text>
  <path d="M 560 410 L 620 555" class="edge"/>
  <text x="560" y="492" class="edge-label">private HTTP</text>
  <path d="M 1020 625 L 900 625 L 900 430 L 700 430" class="edge"/>
