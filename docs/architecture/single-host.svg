  <path d="M 1230 620 L 1390 630" class="edge"/>
  <text x="1310" y="610" class="edge-label">OAuth + custom predict permission</text>
  <path d="M 1350 835 L 1390 835" class="edge"/>
  <text x="1370" y="770" class="edge-label">required egress</text>
</svg>
