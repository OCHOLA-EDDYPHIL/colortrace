[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-persistence"
version = "0.1.0"
description = "Versioned PostgreSQL persistence boundary for ColorTrace hosted metadata"
license = "Apache-2.0"
license-files = []
requires-python = ">=3.12"
dependencies = [
    "cloud-sql-python-connector[pg8000]==1.22.0",
    "pg8000==1.31.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_persistence"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "colortrace_persistence/LICENSE"
