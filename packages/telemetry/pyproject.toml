[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-telemetry"
version = "0.1.0"
description = "Correlated simulator telemetry and local Grafana verification"
requires-python = ">=3.12"
dependencies = [
    "colortrace-fixture",
    "jsonschema==4.25.1",
    "opentelemetry-api==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "PyYAML==6.0.3",
]

[project.scripts]
colortrace-telemetry = "colortrace_telemetry.cli:main"

[tool.uv.sources]
colortrace-fixture = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_telemetry"]
