[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-simulator"
version = "0.1.0"
description = "Fenced local simulator action execution and publication"
license = "Apache-2.0"
license-files = []
requires-python = ">=3.12"
dependencies = [
    "colortrace-fixture",
    "colortrace-response-plans",
    "colortrace-validator",
    "jsonschema==4.25.1",
    "OpenColorIO==2.5.2",
]

[project.optional-dependencies]
reference-worker = [
    "OpenImageIO==3.1.17.0",
]

[project.scripts]
colortrace-reference-worker = "colortrace_simulator.reference_worker:main"

[tool.uv.sources]
colortrace-fixture = { workspace = true }
colortrace-response-plans = { workspace = true }
colortrace-validator = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_simulator"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "colortrace_simulator/LICENSE"
