[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-evaluation"
version = "1.0.0"
description = "Sealed, recomputable ColorTrace reliability evaluation"
requires-python = ">=3.12"
dependencies = [
    "colortrace-api",
    "colortrace-fixture",
    "colortrace-grafana-mcp",
    "colortrace-investigation",
    "colortrace-recovery",
    "colortrace-response-plans",
    "colortrace-simulator",
    "colortrace-telemetry",
    "colortrace-vertical-slice",
    "jsonschema==4.25.1",
]

[project.scripts]
colortrace-evaluation = "colortrace_evaluation.cli:main"

[tool.uv.sources]
colortrace-api = { workspace = true }
colortrace-fixture = { workspace = true }
colortrace-grafana-mcp = { workspace = true }
colortrace-investigation = { workspace = true }
colortrace-recovery = { workspace = true }
colortrace-response-plans = { workspace = true }
colortrace-simulator = { workspace = true }
colortrace-telemetry = { workspace = true }
colortrace-vertical-slice = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_evaluation"]

[tool.hatch.build.targets.wheel.force-include]
"src/colortrace_evaluation/schemas" = "colortrace_evaluation/schemas"
