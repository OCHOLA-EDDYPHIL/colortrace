[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-api"
version = "0.1.0"
description = "ColorTrace incident HTTP API boundary"
license = "Apache-2.0"
license-files = []
requires-python = ">=3.12"
dependencies = [
    "colortrace-fixture",
    "colortrace-persistence",
    "colortrace-recovery",
    "colortrace-response-plans",
    "colortrace-simulator",
    "colortrace-telemetry",
    "colortrace-vertical-slice",
    "fastapi==0.141.1",
    "google-auth[requests]==2.56.3",
    "jsonschema==4.25.1",
    "pyjwt[crypto]==2.13.0",
    "uvicorn==0.52.1",
]

[project.scripts]
colortrace-demo = "colortrace_api.demo:main"

[tool.uv.sources]
colortrace-fixture = {workspace = true}
colortrace-persistence = {workspace = true}
colortrace-recovery = {workspace = true}
colortrace-response-plans = {workspace = true}
colortrace-simulator = {workspace = true}
colortrace-telemetry = {workspace = true}
colortrace-vertical-slice = {workspace = true}

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_api"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "colortrace_api/LICENSE"
