[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-response-plans"
version = "1.0.0"
description = "Immutable response-plan review and dispatch authorization contracts"
license = "Apache-2.0"
license-files = []
requires-python = ">=3.12"
dependencies = ["jsonschema==4.25.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_response_plans"]

[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "colortrace_response_plans/LICENSE"
