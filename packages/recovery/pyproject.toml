[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-recovery"
version = "0.1.0"
description = "Fenced recovery verification and human closure contracts"
requires-python = ">=3.12"
dependencies = [
    "colortrace-fixture",
    "colortrace-grafana-mcp",
    "colortrace-simulator",
    "colortrace-telemetry",
    "jsonschema==4.25.1",
]

[tool.uv.sources]
colortrace-fixture = { workspace = true }
colortrace-grafana-mcp = { workspace = true }
colortrace-simulator = { workspace = true }
colortrace-telemetry = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_recovery"]
