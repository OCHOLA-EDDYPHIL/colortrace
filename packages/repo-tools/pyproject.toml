[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "colortrace-repo"
version = "0.1.0"
description = "Deterministic repository policy checks for ColorTrace"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
colortrace-repo = "colortrace_repo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colortrace_repo"]
